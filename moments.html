<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf7;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e5e5e0;
    --accent: #c94f3d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  /* Top Navigation */
  nav.topnav {
    position: sticky;
    top: 0;
    background: rgba(250, 250, 247, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    z-index: 100;
  }

  nav.topnav ul {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px 32px;
    display: flex;
    justify-content: center;
    gap: 32px;
    list-style: none;
  }

  nav.topnav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: color 0.2s ease;
  }

  nav.topnav a:hover { color: var(--accent); }
  nav.topnav a.active { color: var(--fg); }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 60px 32px 100px;
  }

  /* Gallery Grid — Polaroid style */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px 30px;
    padding: 20px 0;
  }

  .gallery-item {
    background: white;
    padding: 14px 14px 40px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    margin: 0;
  }

  .gallery-item:nth-child(3n+1) { transform: rotate(-2deg); }
  .gallery-item:nth-child(3n+2) { transform: rotate(1.2deg); }
  .gallery-item:nth-child(3n+3) { transform: rotate(-0.8deg); }

  .gallery-item:hover {
    transform: translateY(-6px) rotate(0deg);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
    z-index: 2;
  }

  .gallery-item .photo-frame {
    aspect-ratio: 1;
    background: linear-gradient(135deg, #ede8de, #dfd8c9);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    overflow: hidden;
  }

  .gallery-item .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .gallery-item figcaption {
    text-align: center;
    padding-top: 12px;
    color: #9a9a95;
    font-size: 15px;
    letter-spacing: 0.02em;
    font-family: "Gaegu", "Segoe Script", cursive;
    font-weight: 300;
    line-height: 1.3;
  }

  /* Back link */
  .back-home {
    text-align: center;
    margin-top: 80px;
    padding-top: 40px;
    border-top: 1px solid var(--line);
  }

  .back-home a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: color 0.2s ease;
  }

  .back-home a:hover { color: var(--accent); }

  @media (max-width: 900px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 600px) {
    nav.topnav ul { gap: 20px; padding: 16px 20px; }
    nav.topnav a { font-size: 11px; letter-spacing: 0.1em; }
    .container { padding: 40px 24px 80px; }
    .gallery { grid-template-columns: 1fr; gap: 30px; }
  }
</style>
</head>
<body>

  <nav class="topnav">
    <ul>
      <li><a href="index.html#about">About</a></li>
      <li><a href="moments.html" class="active">Moments</a></li>
      <li><a href="location.html">Location</a></li>
      <li><a href="index.html#invitation">Invite</a></li>
    </ul>
  </nav>

  <div class="container">

    <div class="gallery">
      <figure class="gallery-item">
        <div class="photo-frame">
          <img src="moment1.jpeg" alt="">
        </div>
        <figcaption>2026 봄, 첫 만남</figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="photo-frame">
          <img src="moment2.jpeg" alt="">
        </div>
        <figcaption>여름 저녁</figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="photo-frame">
          <img src="moment3.jpeg" alt="">
        </div>
        <figcaption>가을 산책</figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="photo-frame">
          <img src="moment4.jpeg" alt="">
        </div>
        <figcaption>겨울 카페</figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="photo-frame">
          <img src="moment5.jpeg" alt="">
        </div>
        <figcaption>순간 5</figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="photo-frame">
          <img src="moment6.jpeg" alt="">
        </div>
        <figcaption>순간 6</figcaption>
      </figure>
    </div>

    <div class="back-home">
      <a href="index.html">← 메인으로 돌아가기</a>
    </div>

  </div>
</body>
</html>
