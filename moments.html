<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moments — 순간들</title>
<style>
  :root {
    --bg: #fafaf7;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e5e5e0;
    --accent: #c94f3d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  /* Top Navigation */
  nav.topnav {
    position: sticky;
    top: 0;
    background: rgba(250, 250, 247, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    z-index: 100;
  }

  nav.topnav ul {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px 32px;
    display: flex;
    justify-content: center;
    gap: 32px;
    list-style: none;
  }

  nav.topnav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: color 0.2s ease;
  }

  nav.topnav a:hover { color: var(--accent); }
  nav.topnav a.active { color: var(--fg); }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 60px 32px 100px;
  }

  /* Page Header */
  .page-header {
    text-align: center;
    margin-bottom: 60px;
  }

  .page-header .label {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    font-weight: 500;
  }

  .page-header h1 {
    font-size: 42px;
    font-weight: 300;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }

  .page-header p {
    color: var(--muted);
    font-size: 16px;
  }

  /* Gallery Grid */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .gallery-item {
    aspect-ratio: 1;
    background: linear-gradient(135deg, #ede8de, #dfd8c9);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .gallery-item:hover {
    transform: translateY(-2px);
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .gallery-item figcaption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    color: white;
    font-size: 13px;
    letter-spacing: 0.02em;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .gallery-item:hover figcaption {
    opacity: 1;
  }

  /* Back link */
  .back-home {
    text-align: center;
    margin-top: 80px;
    padding-top: 40px;
    border-top: 1px solid var(--line);
  }

  .back-home a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: color 0.2s ease;
  }

  .back-home a:hover { color: var(--accent); }

  @media (max-width: 900px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 600px) {
    nav.topnav ul { gap: 20px; padding: 16px 20px; }
    nav.topnav a { font-size: 11px; letter-spacing: 0.1em; }
    .container { padding: 40px 24px 80px; }
    .page-header h1 { font-size: 32px; }
    .gallery { grid-template-columns: 1fr; gap: 16px; }
    .gallery-item figcaption { opacity: 1; }
  }
</style>
</head>
<body>

  <nav class="topnav">
    <ul>
      <li><a href="index.html#about">About</a></li>
      <li><a href="moments.html" class="active">Moments</a></li>
      <li><a href="location.html">Location</a></li>
      <li><a href="index.html#invitation">Invite</a></li>
    </ul>
  </nav>

  <div class="container">

    <div class="gallery">
      <figure class="gallery-item">
        <!-- <img src="images/moment1.jpg" alt=""> -->
        IMAGE 1
        <figcaption>2026 봄, 첫 만남</figcaption>
      </figure>
      <figure class="gallery-item">
        <!-- <img src="images/moment2.jpg" alt=""> -->
        IMAGE 2
        <figcaption>여름 저녁</figcaption>
      </figure>
      <figure class="gallery-item">
        <!-- <img src="images/moment3.jpg" alt=""> -->
        IMAGE 3
        <figcaption>가을 산책</figcaption>
      </figure>
      <figure class="gallery-item">
        <!-- <img src="images/moment4.jpg" alt=""> -->
        IMAGE 4
        <figcaption>겨울 카페</figcaption>
      </figure>
      <figure class="gallery-item">
        <!-- <img src="images/moment5.jpg" alt=""> -->
        IMAGE 5
        <figcaption>순간 5</figcaption>
      </figure>
      <figure class="gallery-item">
        <!-- <img src="images/moment6.jpg" alt=""> -->
        IMAGE 6
        <figcaption>순간 6</figcaption>
      </figure>
    </div>

    <div class="back-home">
      <a href="index.html">← 메인으로 돌아가기</a>
    </div>

  </div>
</body>
</html>
