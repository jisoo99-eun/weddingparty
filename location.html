<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location — 오시는 길</title>
<style>
  :root {
    --bg: #FFF6EA;
    --fg: #2a2a28;
    --muted: #9a938a;
    --accent: #2d4a2b;
    --line: #e5dec9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  /* Top Navigation */
  nav.topnav {
    position: sticky;
    top: 0;
    background: rgba(255, 246, 234, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    z-index: 100;
  }

  nav.topnav ul {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 32px;
    display: flex;
    justify-content: center;
    gap: 40px;
    list-style: none;
  }

  nav.topnav a {
    position: relative;
    color: var(--fg);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: color 0.2s ease;
    padding: 4px 0;
  }

  nav.topnav a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -4px;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.25s ease;
  }

  nav.topnav a:hover { color: var(--accent); }
  nav.topnav a:hover::after { transform: scaleX(1); }
  nav.topnav a.active { color: var(--accent); }
  nav.topnav a.active::after { transform: scaleX(1); }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 50px 32px 80px;
  }

  /* Logo image */
  .logo-image {
    width: 100%;
    max-width: 300px;
    margin: 0 auto 30px;
    display: block;
  }

  .logo-image img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Map illustration */
  .map-illustration {
    width: 100%;
    max-width: 560px;
    margin: 40px auto 60px;
    display: block;
  }

  .map-illustration img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Info sections */
  .info-block {
    text-align: center;
    margin-bottom: 50px;
  }

  .info-block h2 {
    font-size: 26px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 24px;
    letter-spacing: 0.05em;
  }

  .info-block .address {
    font-size: 16px;
    color: var(--fg);
    margin-bottom: 20px;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .info-block .lot {
    font-size: 15px;
    color: var(--fg);
    margin-bottom: 6px;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .star-mark {
    position: relative;
    display: inline-block;
  }

  .star-mark::before {
    content: "★";
    position: absolute;
    top: -9px;
    left: -10px;
    font-size: 11px;
    color: #FFC700;
    line-height: 1;
  }

  .info-block .detail {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.9;
    letter-spacing: 0.02em;
  }

  .info-block .detail.spaced {
    margin-top: 24px;
  }

  /* Map App Buttons */
  .map-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
  }

  .map-buttons a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: white;
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.03em;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .map-buttons a:hover {
    background: var(--accent);
    color: white;
  }

  .map-buttons .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .map-buttons .dot-naver { background: #03C75A; }
  .map-buttons .dot-kakao { background: #FFCD00; }

  .map-buttons a:hover .dot {
    box-shadow: 0 0 0 2px white;
  }

  /* Bottom logo link */
  a.bottom-logo-link {
    display: block;
    text-decoration: none;
  }

  /* Divider */
  .divider {
    width: 40px;
    height: 1px;
    background: var(--line);
    margin: 50px auto;
  }

  /* Bottom logo (smaller) */
  .bottom-logo {
    width: 100%;
    max-width: 280px;
    margin: 60px auto 0;
    display: block;
    opacity: 0.85;
  }

  .bottom-logo img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Back link */
  .back-home {
    text-align: center;
    margin-top: 60px;
    padding-top: 40px;
    border-top: 1px solid var(--line);
  }

  .back-home a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: color 0.2s ease;
  }

  .back-home a:hover { color: var(--accent); }

  @media (max-width: 600px) {
    nav.topnav ul { gap: 22px; padding: 16px 16px; }
    nav.topnav a { font-size: 13px; letter-spacing: 0.1em; }
    .container { padding: 40px 24px 60px; }
    .info-block h2 { font-size: 22px; }
    .logo-image { max-width: 240px; }
    .bottom-logo { max-width: 220px; }
    .info-block .address { font-size: 15px; }
    .info-block .lot { font-size: 14px; }
    .info-block .detail { font-size: 12px; }
  }
</style>
</head>
<body>

  <nav class="topnav">
    <ul>
      <li><a href="index.html#about">About</a></li>
      <li><a href="moments.html">Moments</a></li>
      <li><a href="location.html" class="active">Location</a></li>
      <li><a href="index.html#invitation">Invite</a></li>
    </ul>
  </nav>

  <div class="container">

    <!-- Illustrated Map -->
    <div class="map-illustration">
      <img src="images/tilted-map.jpg" alt="틸티드 한남 약도">
    </div>

    <!-- 위치 -->
    <div class="info-block">
      <h2>위치</h2>
      <p class="address">서울 용산구 한남대로 150-10</p>
      <p class="detail">지하철 6호선 한강진역 2번 출구 도보 4분</p>
      <p class="detail">버스 서울시중부기술교육원/블루스퀘어역 도보 1분</p>

      <div class="map-buttons">
        <a href="https://map.naver.com/v5/search/서울 용산구 한남대로 150-10" target="_blank" rel="noopener">
          <span class="dot dot-naver"></span>
          네이버 지도
        </a>
        <a href="https://map.kakao.com/?q=서울 용산구 한남대로 150-10" target="_blank" rel="noopener">
          <span class="dot dot-kakao"></span>
          카카오맵
        </a>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 주차 -->
    <div class="info-block">
      <h2>주차</h2>
      <p class="lot"><span class="star-mark">볼보빌딩</span> / 블루스퀘어</p>
      <p class="lot">한강진공영 / 한남역공영</p>
      <p class="detail spaced">
        주말이라 공영주차장도 혼잡할 수 있습니다.<br>
        너그러운 마음으로 양해 부탁드립니다.
      </p>
    </div>

    <!-- Bottom Logo (small) - links to Instagram -->
    <a href="https://www.instagram.com/tiltedhannam?igsh=MTdub3NlNXp0ZXZscw==" target="_blank" rel="noopener" class="bottom-logo-link">
      <div class="bottom-logo">
        <img src="images/tilted-logo.jpg" alt="Tilted Hannam Instagram">
      </div>
    </a>

    <div class="back-home">
      <a href="index.html">← 메인으로 돌아가기</a>
    </div>

  </div>
</body>
</html>
